api_version: "2.3.0"
name: crm-assistant
resources:
  - key: crm-assistant
    kind: harness_agent
    spec:
      source_path: api/tau/main.py
      llm_provider: openai
      llm_model: gpt-5.4
      llm_thinking: medium
      automatic_deployment: true
      automatic_redeployment:
        enabled: true
        tag_regex: null
      revision_retention_count: 3
      env_vars:
        - name: TAU_EXCLUDE_BASE_TOOLS
          value: "true"
        - name: TAU_EXCLUDE_MAINSEQUENCE_MCP
          value: "true"
