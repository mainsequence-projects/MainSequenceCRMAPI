api_version: "2.3.0"
name: crm-api
resources:
  - key: crm
    kind: fastapi
    access:
      branches:
        - repository: MetaTables
          level: view
    spec:
      source_path: api/crm/main.py
      mcp_enabled: true
      cpu_request: "0.5"
      memory_request: 1Gi
      spot: false
      automatic_deployment: true
      automatic_redeployment:
        enabled: true
        tag_regex: null
      revision_retention_count: 3
      public_ingress:
        - method: GET
          path: /extensions/google/oauth/callback/
        - method: GET
          path: /extensions/google/oauth/done/

  - key: migrate-crm
    kind: job
    access:
      branches:
        - repository: MetaTables
          level: view
    spec:
      name: CRM migrations
      description: Applies the CRM MetaTables migrations before the CRM API and assistant roll out.
      execution_path: jobs/migrate_crm.py
      cpu_request: "0.5"
      memory_request: "1"
      max_runtime_seconds: 1800
      spot: false
      automatic_redeployment:
        enabled: true
        tag_regex: null

  - key: crm-assistant
    kind: harness_agent
    acts_for_requester: true
    access:
      resources:
        - key: crm
          level: view
    spec:
      source_path: api/tau/main.py
      mcp_applications:
        - resource: crm
      llm_provider: openai
      llm_model: gpt-5.4
      llm_thinking: medium
      automatic_deployment: true
      automatic_redeployment:
        enabled: true
        tag_regex: null
      revision_retention_count: 3
      env_vars:
        - name: TAU_EXCLUDE_BASE_TOOLS
          value: "true"
        - name: TAU_EXCLUDE_MAINSEQUENCE_MCP
          value: "true"

# This is the repository's only workflow file. The migration Job runs from the
# API's candidate image, and the API and the CRM assistant deploy only after it
# succeeds, each from its own resource's image step. A scheduled Job belongs in
# this file too, but outside execution.steps: a step-referenced Job gets its new
# image when the run is admitted, before the migration runs.
execution:
  steps:
    image:
      prepare_image: crm
    migrate:
      run_job: migrate-crm
      image_from: image
      needs: [image]
    deploy_api:
      deploy: crm
      image_from: image
      needs: [migrate]
    image_assistant:
      prepare_image: crm-assistant
    deploy_assistant:
      deploy: crm-assistant
      image_from: image_assistant
      needs: [deploy_api, image_assistant]
